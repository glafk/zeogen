root_path: ${oc.env:PROJECT_ROOT}/data/MOR
prop: hoa
num_targets: 1
niggli: false
primitive: true
graph_method: crystalnn
lattice_scale_method: scale_length
preprocess_workers: 4
readout: mean
max_atoms: 1024
otf_graph: false
eval_model_name: diffusion


train_max_epochs: 10
early_stopping_patience: 20
teacher_forcing_max_epoch: 3

datamodule:
  _target_: data_utils.data_module.CrystDataModule

  datasets:
    train:
      _target_: data_utils.CrystalDataset.TensorCrystDataset
      name: HOA train
      path: ${data.root_path}/MOR_train.pickle
      prop: ${data.prop}
      niggli: ${data.niggli}
      primitive: ${data.primitive}
      graph_method: ${data.graph_method}
      lattice_scale_method: ${data.lattice_scale_method}
      preprocess_workers: ${data.preprocess_workers}
      # num_records: 250

    val:
      _target_: data_utils.CrystalDataset.TensorCrystDataset
      name: HOA val
      path: ${data.root_path}/MOR_val.pickle
      prop: ${data.prop}
      niggli: ${data.niggli}
      primitive: ${data.primitive}
      graph_method: ${data.graph_method}
      lattice_scale_method: ${data.lattice_scale_method}
      preprocess_workers: ${data.preprocess_workers}
      # num_records: 250

    test:
      _target_: data_utils.CrystalDataset.TensorCrystDataset
      name: HOA test
      path: ${data.root_path}/MOR_test.pickle
      prop: ${data.prop}
      niggli: ${data.niggli}
      primitive: ${data.primitive}
      graph_method: ${data.graph_method}
      lattice_scale_method: ${data.lattice_scale_method}
      preprocess_workers: ${data.preprocess_workers}
      # num_records: 100

    predict:
      _target_: data_utils.CrystalDataset.TensorCrystDataset
      name: HOA test
      path: ${data.root_path}/MOR_test.pickle
      prop: ${data.prop}
      niggli: ${data.niggli}
      primitive: ${data.primitive}
      graph_method: ${data.graph_method}
      lattice_scale_method: ${data.lattice_scale_method}
      preprocess_workers: ${data.preprocess_workers}
      num_records: 10

  num_workers:
    train: 0
    val: 0
    test: 0
    predict: 0

  batch_size:
    train: 16
    val: 16
    test: 16
    predict: 1